<div class="modal-overlay" id="episodeModal">
    <div class="modal-box">
        <button class="modal-close" id="modalClose">×</button>

        <h2 class="modal-title" id="modalTitle">Title</h2>

        <div class="modal-info">
            <div>
                <p class="info-label">Season</p>
                <p id="modalSeason">1</p>
            </div>
            <div>
                <p class="info-label">Air date</p>
                <p id="modalAirdate">—</p>
            </div>
        </div>

        <h3 class="characters-heading">Characters</h3>

        <div class="characters-grid">
            <div class="character">
                <img src="./img/rick-modal.png" alt="">
                <p>Rick</p>
            </div>
            <div class="character">
                <img src="./img/morty-modal.png" alt="">
                <p>Morty</p>
            </div>
            <div class="character">
                <img src="./img/beth-modal.png" alt="">
                <p>Beth</p>
            </div>
            <div class="character">
                <img src="./img/jerry-modal.png" alt="">
                <p>Jerry</p>
            </div>
        </div>
    </div>
</div>
